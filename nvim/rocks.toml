# This is your rocks.nvim plugins declaration file.
# Here is a small yet pretty detailed example on how to use it:
#
# [plugins]
# nvim-treesitter = "semver_version"  # e.g. "1.0.0"

# List of non-Neovim rocks.
# This includes things like `toml` or other lua packages.
[rocks]

# List of Neovim plugins to install alongside their versions.
# If the plugin name contains a dot then you must add quotes to the key name!
[plugins]
"rocks.nvim" = "2.38.2"
"rocks-git.nvim" = "2.0.1"
"rocks-config.nvim" = "2.2.0"
"tokyonight.nvim" = "4.8.0"
"flash.nvim" = "2.1.0"
tree-sitter-python = "scm"
nvim-treesitter-legacy-api = "0.9.2"
nvim-treesitter-textobjects = "scm"
"telescope.nvim" = "scm"
"telescope-file-browser.nvim" = "scm"
"todo-comments.nvim" = "1.3.0"
cmp-nvim-lsp = "scm"
"mason.nvim" = "1.10.0"
"mason-lspconfig.nvim" = "1.30.0"
nvim-lspconfig = "0.1.8"
nvim-cmp = "0.0.1"
"lsp_signature.nvim" = "0.3.1"
neotest = "5.4.1"
nvim-dap-python = "scm"
nvim-dap-ui = "4.0.0"
nvim-dap = "0.8.0"

[plugins."telescope-live-grep-args.nvim" ]
git = "nvim-telescope/telescope-live-grep-args.nvim"
rev = "v1.1.0^{}"

[plugins."telescope-fzf-native.nvim" ]
git = "nvim-telescope/telescope-fzf-native.nvim"
rev = "cf48d4dfce44e0b9a2e19a008d6ec6ea6f01a83b"

[plugins."undotree" ]
git = "mbbill/undotree"
rev = "rel_6.1"

[plugins."fugitive" ]
git = "tpope/vim-fugitive"
rev = "v3.7^{}"

[plugins.nerdcommenter ]
git = "preservim/nerdcommenter"
rev = "2.7.0^{}"

[plugins.gitsigns ]
git = "lewis6991/gitsigns.nvim"
rev = "v0.9.0"

[plugins."nvim-highlight-colors" ]
git = "brenoprata10/nvim-highlight-colors"
rev = "a411550ef85cae467b889ba7d1a96bd78332d90e"

[plugins.tokyonight.nvim]
opt = true

[plugins.neotest-python]
git = "nvim-neotest/neotest-python"
rev = "72603dfdbaad5695160268cb10531a14cc37236e"

[bundles.telescope]
items = [
    "telescope-live-grep-args.nvim",
    "telescope-fzf-native.nvim",
    "telescope.nvim",
    "telescope-file-browser.nvim"
]

[bundles.lsp]
items = [
    "nvim-lspconfig",
    "cmp-nvim-lsp",
    "nvim-cmp",
    "mason.nvim",
    "mason-lspconfig.nvim"
]

[bundles.neotest]
items = [
    "neotest",
    "nvim-dap-python",
    "neotest-python",
]

[bundles.dap]
items = [
    "nvim-dap",
    "nvim-dap-ui",
    "nvim-dap-python",
]

[bundles.treesitter]
items = [
    "nvim-treesitter-legacy-api",
    "nvim-treesitter-textobjects",
]
